<!--
  templates/page-template.html
  -----------------------------
  Starting point for every new page. Copy this whole file to the repo
  root under its real name (e.g. contact.html), then:

    1. Replace PAGE_TITLE and PAGE_DESCRIPTION in <head>.
    2. Add a page-specific stylesheet link if this page needs one
       (css/home.css, css/products.css, css/partners.css, css/contact.css)
       — keep it to ONE file per page/template so ownership stays clean.
    3. Set aria-current="page" on the matching nav link.
    4. Replace <!-- PAGE CONTENT --> with the real content.
    5. Add a page-specific <script> tag at the bottom only if this page
       needs its own JS (partners.html and contact.html do; the others
       shouldn't need to).

  This fixes the old site's #1 bug by construction: explicit UTF-8 on
  every single page, every time.
-->
